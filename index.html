<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Tack Market V3</title>
<meta name="description" content="A standalone stock-trading simulator with realistic, fictional market data. Practise trading without risking real money.">
<style>
:root {
  --bg: #0b0f14; --panel: #111821; --panel2: #17212c; --border: #243241; --text: #e6edf3; --muted: #9aa7b4; --faint: #66737f;
  --accent: #f2b544; --accent-ink: #1a1200; --up: #2fbf71; --down: #ef5350; --info: #5aa9e6; --warn: #f2b544; --grid: #1c2733;
  --s-index: #5aa9e6; --s-equal: #a08cf5; --s-momentum: #e46aa4; --s-value: #34b9a8; --s-rules: #a9b25c; --sma20: #c9a23a; --sma50: #8f7cf0;
  --reg-bull: #1f6f47; --reg-chop: #4a5561; --reg-bear: #8a3b3b; --reg-crash: #c62828; --reg-recovery: #2b7f91;
  --shadow: 0 1px 0 rgba(255,255,255,.02), 0 8px 24px rgba(0,0,0,.25);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f5f8; --panel: #ffffff; --panel2: #f1f4f7; --border: #d6dde5; --text: #13202c; --muted: #4f5e6c; --faint: #85929f;
    --accent: #a8690f; --accent-ink: #ffffff; --up: #137a45; --down: #c62828; --info: #1f6fb2; --warn: #a8690f; --grid: #e7ecf1;
    --s-index: #1f6fb2; --s-equal: #6a52d6; --s-momentum: #c23a7a; --s-value: #13867a; --s-rules: #6f7a1e; --sma20: #a8690f; --sma50: #6a52d6;
    --reg-bull: #b9e3c9; --reg-chop: #d5dbe1; --reg-bear: #f1c4c4; --reg-crash: #e57373; --reg-recovery: #b5dde6;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 6px 18px rgba(16,24,40,.06);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f5f8; --panel: #ffffff; --panel2: #f1f4f7; --border: #d6dde5; --text: #13202c; --muted: #4f5e6c; --faint: #85929f;
  --accent: #a8690f; --accent-ink: #ffffff; --up: #137a45; --down: #c62828; --info: #1f6fb2; --warn: #a8690f; --grid: #e7ecf1;
  --s-index: #1f6fb2; --s-equal: #6a52d6; --s-momentum: #c23a7a; --s-value: #13867a; --s-rules: #6f7a1e; --sma20: #a8690f; --sma50: #6a52d6;
  --reg-bull: #b9e3c9; --reg-chop: #d5dbe1; --reg-bear: #f1c4c4; --reg-crash: #e57373; --reg-recovery: #b5dde6;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 6px 18px rgba(16,24,40,.06);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--info); }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { text-align: right; white-space: nowrap; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); } .faint { color: var(--faint); }
.small { font-size: 12px; } .tiny { font-size: 11px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
p { margin: 0 0 8px; }

.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }
.pad { padding: 12px 14px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; color: var(--muted); background: var(--panel2); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: 0 0 8px; }
.tag { display: inline-block; padding: 0 5px; border-radius: 4px; font: 600 10px/16px var(--mono); border: 1px solid var(--border); color: var(--muted); }
.tag.e { color: var(--warn); border-color: var(--warn); } .tag.d { color: var(--info); border-color: var(--info); }
.tag.l { color: var(--up); border-color: var(--up); } .tag.s { color: var(--down); border-color: var(--down); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2); cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.buy { background: var(--up); border-color: var(--up); color: #fff; }
.btn.sell { background: var(--down); border-color: var(--down); color: #fff; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
.btn.link { background: none; border: none; padding: 0; color: var(--info); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: none; background: transparent; padding: 5px 10px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 12px; }
.seg button.on { background: var(--panel2); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.seg.big { display: flex; } .seg.big button { flex: 1; padding: 8px; font-size: 13px; }
.seg.big button.on.b { background: var(--up); color: #fff; box-shadow: none; }
.seg.big button.on.s { background: var(--down); color: #fff; box-shadow: none; }

label.f { display: block; margin: 8px 0 0; font-size: 12px; color: var(--muted); }
label.f > span { display: block; margin-bottom: 3px; }
input[type=text], input[type=number], input[type=search], select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { resize: vertical; min-height: 44px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { min-width: 0; }
.grow { flex: 1; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.check { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; cursor: pointer; }

table { width: 100%; border-collapse: collapse; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--grid); text-align: left; vertical-align: middle; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; position: sticky; top: 0; background: var(--panel); z-index: 1; }
td.num, th.num { text-align: right; }
tbody tr:hover { background: var(--panel2); }
.tablewrap { overflow-x: auto; }
.empty { padding: 18px; text-align: center; color: var(--faint); }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
.brand { font: 800 15px/1 var(--mono); letter-spacing: .12em; color: var(--accent); cursor: pointer; }
.brand small { color: var(--faint); font-weight: 600; letter-spacing: .04em; margin-left: 4px; }
.stat { display: flex; flex-direction: column; }
.stat b { font: 600 14px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
.topbar .spacer { flex: 1; }
.banner { margin: 10px 10px 0; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel2); display: flex; gap: 14px; align-items: flex-start; }
.banner ul { margin: 4px 0 0; padding-left: 18px; }
.banner .x { margin-left: auto; }
.alert-bad { border-color: var(--down); }

/* board layout */
.layout { display: grid; gap: 10px; padding: 10px; grid-template-columns: 280px minmax(0, 1fr) 340px; grid-template-areas: "watch chart ticket" "watch tabs tabs"; align-items: start; }
.watch { grid-area: watch; position: sticky; top: 62px; max-height: calc(100vh - 72px); display: flex; flex-direction: column; }
.chartcol { grid-area: chart; min-width: 0; }
.ticket { grid-area: ticket; }
.tabs { grid-area: tabs; min-width: 0; }

.watch-head { padding: 10px 10px 6px; border-bottom: 1px solid var(--border); }
.watch-list { overflow-y: auto; flex: 1; }
.wrow { display: grid; grid-template-columns: 10px 1fr auto; gap: 2px 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--grid); cursor: pointer; }
.wrow:hover { background: var(--panel2); }
.wrow.on { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
.wrow .sym { font: 700 13px/1.1 var(--mono); }
.wrow .nm { grid-column: 2; font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wrow .px { font: 600 13px/1.1 var(--mono); text-align: right; }
.wrow .ch { font: 12px/1.1 var(--mono); text-align: right; grid-column: 3; }
.wrow .flags { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: 1px; }
.filters { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.filters button { border: 1px solid var(--border); background: transparent; border-radius: 999px; font-size: 11px; padding: 1px 7px; cursor: pointer; color: var(--muted); }
.filters button.on { border-color: var(--accent); color: var(--text); }

.chart-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 12px 14px 4px; }
.chart-head .big { font: 700 22px/1 var(--mono); }
.chart-tools { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 14px 6px; align-items: center; }
.canvas-wrap { position: relative; padding: 0 6px 6px 10px; }
canvas { display: block; width: 100%; }
#priceChart { height: 340px; cursor: crosshair; }
.profile { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1px; background: var(--grid); border-top: 1px solid var(--border); }
.profile > div { background: var(--panel); padding: 8px 12px; }
.profile .v { font: 600 13px/1.3 var(--mono); }
.newsbox { border-top: 1px solid var(--border); padding: 8px 14px 12px; }
.news-item { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--grid); font-size: 13px; }
.news-item:last-child { border-bottom: none; }
.news-item .when { font: 11px/1.6 var(--mono); color: var(--faint); flex: 0 0 64px; }
.tone-1 { border-left: 3px solid var(--up); padding-left: 8px; } .tone--1 { border-left: 3px solid var(--down); padding-left: 8px; } .tone-0 { border-left: 3px solid var(--border); padding-left: 8px; }

.ticket .pad { padding: 12px; }
.preview { margin-top: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel2); font-size: 12px; }
.preview .kv { display: flex; justify-content: space-between; padding: 3px 10px; }
.preview .kv b { font-family: var(--mono); font-weight: 600; }
.preview ul { list-style: none; margin: 0; padding: 6px 10px 8px; border-top: 1px solid var(--border); }
.preview li { padding: 2px 0 2px 18px; position: relative; }
.preview li::before { position: absolute; left: 0; font-weight: 700; }
.preview li.block { color: var(--down); } .preview li.block::before { content: '✕'; }
.preview li.warn { color: var(--warn); } .preview li.warn::before { content: '!'; left: 4px; }
.preview li.info { color: var(--muted); } .preview li.info::before { content: 'i'; left: 4px; font-style: italic; }
.hint { font-size: 11px; color: var(--faint); margin-top: 8px; }

.tabbar { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--border); padding: 0 8px; }
.tabbar button { background: none; border: none; border-bottom: 2px solid transparent; padding: 10px 10px 8px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px; white-space: nowrap; }
.tabbar button.on { color: var(--text); border-bottom-color: var(--accent); }
.tabbody { padding: 10px 12px 14px; }
.tabbody.scroll { max-height: 520px; overflow: auto; }
.cols2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px; }
@media (max-width: 900px) { .cols2 { grid-template-columns: minmax(0, 1fr); } }
.metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.metric { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.metric b { display: block; font: 600 16px/1.3 var(--mono); }
.metric span { font-size: 11px; color: var(--faint); }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.legend button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; background: transparent; padding: 2px 9px; cursor: pointer; font-size: 12px; color: var(--muted); }
.legend button.on { color: var(--text); background: var(--panel2); }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
#perfChart, #endChart { height: 260px; }
#ddChart { height: 110px; }
#regimeChart { height: 70px; }

.coach { display: grid; gap: 8px; }
.coach-item { border: 1px solid var(--border); border-left-width: 4px; border-radius: 8px; padding: 8px 12px; background: var(--panel2); }
.coach-item.bad { border-left-color: var(--down); } .coach-item.warn { border-left-color: var(--warn); }
.coach-item.good { border-left-color: var(--up); } .coach-item.info { border-left-color: var(--info); }
.coach-item b { display: block; margin-bottom: 2px; }
.coach-item p { margin: 0; color: var(--muted); font-size: 13px; }

.learn { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
.learn article { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--panel2); font-size: 13px; }
.learn h4 { margin-bottom: 6px; font-size: 14px; }
.learn p, .learn li { color: var(--muted); }
.learn ul { margin: 4px 0 0; padding-left: 18px; }
.learn code { font-family: var(--mono); font-size: 12px; color: var(--text); }

/* home & end */
.home { max-width: 1160px; margin: 0 auto; padding: 22px 16px 40px; }
.hero { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
.hero h1 { font: 800 30px/1 var(--mono); letter-spacing: .1em; color: var(--accent); }
.hero h1 small { font-size: 14px; color: var(--faint); letter-spacing: .05em; }
.hero p { color: var(--muted); max-width: 640px; margin: 8px 0 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.card h3 { font-size: 16px; margin-bottom: 4px; }
.card .sub { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.level { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-top: 10px; background: var(--panel2); }
.level.locked { opacity: .55; }
.level ul { margin: 6px 0 8px; padding-left: 18px; color: var(--muted); font-size: 12px; }
.badge { display: inline-block; font: 700 10px/16px var(--mono); padding: 0 6px; border-radius: 4px; letter-spacing: .06em; }
.badge.pass { background: var(--up); color: #fff; } .badge.fail { background: var(--down); color: #fff; } .badge.lock { background: var(--border); color: var(--muted); }
.continue { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; border-color: var(--accent); }
.continue.resume { border-width: 2px; background: var(--panel2); }
.help-intro { margin-bottom: 8px; }
table.cycle { margin: 10px 0 2px; font-size: 13px; }
table.cycle th, table.cycle td { padding: 6px 8px; vertical-align: top; color: var(--text); }
table.cycle td { border-bottom: 1px solid var(--grid); }
.footer { margin-top: 26px; color: var(--faint); font-size: 12px; text-align: center; }
.result { text-align: center; padding: 18px 12px 6px; }
.result .big { font: 800 28px/1.1 var(--mono); letter-spacing: .06em; }
.checks { list-style: none; padding: 0; margin: 10px 0 0; }
.checks li { display: flex; gap: 10px; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
.section { margin-top: 14px; }
.section > h3 { font-size: 15px; margin: 0 0 8px; }
.regimes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50; background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; max-width: calc(100vw - 32px); box-shadow: var(--shadow); }
.kbd { font: 11px var(--mono); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: tm-in .18s ease-out; } @keyframes tm-in { from { opacity: 0; transform: translate(-50%, 6px); } } }

/* help guide */
.qbtn { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; min-height: 0 !important; padding: 0 !important; border-radius: 50%; border: 1px solid var(--border); background: var(--panel2); color: var(--muted); font: 700 11px/1 var(--sans); cursor: pointer; vertical-align: 1px; letter-spacing: 0; text-transform: none; }
.qbtn:hover { color: var(--text); border-color: var(--accent); }
.topbar .qbtn { width: 30px; height: 30px; font-size: 14px; }
.help-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 14px; align-items: start; }
.help-toc { position: sticky; top: calc(var(--tb, 56px) + 10px); max-height: calc(100vh - var(--tb, 56px) - 20px); overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.help-toc button { text-align: left; background: none; border: none; padding: 7px 10px; border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 13px; line-height: 1.3; }
.help-toc button:hover { color: var(--text); background: var(--panel2); }
.help-toc button.on { color: var(--text); background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
.help-sec { margin-bottom: 12px; }
.help-pager { display: flex; justify-content: space-between; gap: 10px; margin: 4px 0 12px; }
.help-pager .btn { white-space: normal; text-align: left; max-width: 48%; }
.help-pager .btn:last-child { text-align: right; }
.totop { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 25; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-weight: 600; box-shadow: var(--shadow); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .15s; }
.totop.show { opacity: 1; pointer-events: auto; }
@media (max-width: 899px) {
  .help-layout { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .help-toc { top: var(--tb, 56px); z-index: 15; flex-direction: row; overflow-x: auto; overflow-y: hidden; max-height: none; gap: 6px; padding: 8px 2px; margin: -4px -2px 0; background: var(--bg); scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .help-toc::-webkit-scrollbar { display: none; }
  .help-toc button { flex: 0 0 auto; white-space: nowrap; border: 1px solid var(--border); border-radius: 999px; padding: 5px 11px; font-size: 12px; }
  .help-toc button.on { box-shadow: none; border-color: var(--accent); }
}
.help-sec h2 { font-size: 17px; margin-bottom: 6px; }
.glossary { margin: 8px 0 0; }
.glossary > div { display: grid; grid-template-columns: minmax(140px, 230px) minmax(0, 1fr); gap: 4px 16px; padding: 8px 0; border-top: 1px solid var(--grid); }
.glossary dt { font-weight: 700; }
.glossary dd { margin: 0; color: var(--muted); }
.glossary code, .help code { font-family: var(--mono); font-size: 12px; color: var(--text); }
.printonly { display: none; }
@media (max-width: 599px) { .glossary > div { grid-template-columns: minmax(0, 1fr); gap: 2px; } #helpQ { max-width: none !important; order: 10; flex-basis: 100%; } }
@media print {
  :root, :root[data-theme] { --bg: #fff; --panel: #fff; --panel2: #fff; --border: #ccc; --grid: #ddd; --text: #000; --muted: #333; --faint: #555; --accent: #8a5a00; }
  body { background: #fff; color: #000; }
  .noprint, .toast { display: none !important; }
  .printonly { display: block; margin-bottom: 12px; }
  .panel { box-shadow: none; border: none; padding: 0; }
  .help-sec { break-inside: auto; margin-bottom: 18px; }
  .glossary > div { break-inside: avoid; }
}

/* ---------- responsive: PC (default), unfolded foldable, folded cover screen ---------- */
/* Unfolded foldable / tablet (about 600-1099px, near-square): watchlist beside chart + ticket. */
@media (max-width: 1099px) {
  .layout { grid-template-columns: 230px minmax(0, 1fr); grid-template-areas: "watch chart" "watch ticket" "tabs tabs"; padding: 8px; gap: 8px; }
  .watch { top: 58px; max-height: calc(100vh - 66px); max-height: calc(100dvh - 66px); }
  .topbar { gap: 4px 14px; }
  .hide-md { display: none !important; }
}
/* Folded cover screen / phone (under 600px): one pane at a time with a bottom navigation bar. */

<script>
/* Tack Market V3 · market engine
   Builds a synthetic but statistically realistic market from a seed. Nothing here is real data:
   the companies, prices, news and calendar are all generated.
   Model: regime-switching market factor (GARCH volatility, fat tails, leverage effect), sector and
   interest-rate factors, per-stock momentum, valuation mean-reversion, short-term reversal,

var TM = typeof TM !== 'undefined' ? TM : {};

  'use strict';

  function mulberry32(a) {

    { id: 'value', label: 'Value bot', desc: 'Every 21 days holds the 8 stocks with the most upside to their analyst target price.' },

      intro: 'Tack Market is turn-based and works the same way in Practice, Career levels and the Daily challenge. Each turn is one trading day, and <b>whenever you are looking at the screen the market is closed</b>: you always act after the close, like a swing trader planning the next morning in the evening. The market is only \u201copen\u201d inside the <b>Next day</b> step, when the game plays a whole trading day in one go and your orders execute.<table class="cycle"><thead><tr><th>Phase</th><th>What happens</th><th>Who acts</th></tr></thead><tbody><tr><td><b>After the close</b><br><span class="faint">the screen you see</span></td><td>Today\u2019s trading is over. Prices, news and positions are final.</td><td><b>You</b>: study, place, edit or cancel orders</td></tr><tr><td><b>Next day</b><br><span class="faint">button pressed</span></td><td>The next trading day plays out: the <b>open</b>, the moves during the day, then the <b>close</b>. Orders fill along the way.</td><td><b>The market</b></td></tr><tr><td><b>After the next close</b></td><td>You are back on the screen, one day later, with the results.</td><td><b>You</b> again</td></tr></tbody></table>',
      items: [
        ['Is the market ever open?', 'Not while you are on the screen. Nothing trades in real time, so there is no rush and you cannot react to tomorrow\u2019s prices before committing. You make every decision with the information you would really have at the close.'],
        ['Day 0 of 60', 'The session has not started. You are looking at the close of the last day of the one-year warm-up history, and nothing you can trade has happened yet. Press <b>Next day</b> once and you are at the close of Day 1. The session ends at the close of the final day (Day 60 here).'],
        ['Same in every mode', 'Practice, the three Career levels and the Daily challenge all use this day cycle. They differ only in settings, rules and how you are graded.'],
        ['After the close', 'You see every price up to and including today’s close. Nothing you do can change today. Decide what to do tomorrow.'],
        ['Queue orders', 'Build an order in the <b>Trade</b> ticket and press <b>Queue order</b>. It does not execute yet: it waits for tomorrow.'],
        ['Next day', 'Reveals tomorrow. Market orders fill at the <b>open</b>; limit and stop orders fill if and when that day’s price path reaches them. Dividends, interest, fees and margin checks are applied, and every bot trades the same day.'],
        ['+5 days', 'Advances five days in a row. Your working orders keep running. Useful when you are holding and have nothing to change.'],
        ['Overnight gap', 'The difference between yesterday’s close and today’s open. Earnings, company news and macro data arrive overnight, so the open can be far from the close. Market orders and stops fill at the open, gap included.'],
        ['Session', 'A fixed number of trading days (30, 60, 120 or 250). At the end you get a debrief comparing you with the index and four bots on the identical market.'],
        ['Warm-up history', 'Every session starts with one year (250 days) of price history already generated, so you can study charts and trends before your first trade.'],
        ['Fictional data', 'All companies, prices, news, dates and analysts are invented and generated on your device. They are designed to behave like real stocks statistically, but none of it is real market data.'],
        ['Saving', 'The game saves in your browser after every day and after every order. Because the whole market is fixed by its seed, closing or refreshing the page can never change what happens next.']
      ]
    },
    {
      id: 'practice', title: 'Practice settings',
      intro: 'Choices on the home screen before starting a Practice session.',
      items: [
        ['Market scenario', 'The overall shape of the market during your session. The one-year warm-up history is always random; the scenario controls the session days only. Individual stocks still move in their own way inside the scenario.'],
        ['Scenario: Random', 'Market regimes switch at random, as in an unknown future: long calm bull runs, choppy patches, occasional bear markets and rare crashes. Over long periods the market drifts upward (about +8% a year on average) but any single session can go either way.'],
        ['Scenario: Steady bull', 'A rising market with one choppy patch in the middle. Tests whether active trading can beat simply holding the index when the trend is your friend. Most people find it surprisingly hard.'],
        ['Scenario: 2008-shape (slow-burn crash)', 'A choppy top, then a grinding bear market led by banks (Financials fall hardest), a short crash, more weakness, and finally a sharp recovery. Teaches patience, sector risk and not bottom-picking too early. The shape is stylised, not a replay of real 2008 prices.'],
        ['Scenario: 2020-shape (V-shaped shock)', 'A calm bull market, then a violent crash over a few weeks (Energy is hit hardest, Technology holds up best), then an equally fast rebound. Teaches the cost of panic selling and of missing the recovery.'],
        ['Scenario: 2022-shape (rate-shock grind)', 'Inflation runs hot and the central bank keeps raising rates. Long-duration growth stocks (Technology, Utilities) bleed while Energy and banks hold up. No crash, just a long, frustrating decline. Teaches interest-rate sensitivity and sector rotation.'],
        ['Scenario: 2000-shape (bubble then bust)', 'A tech mania lifts the whole market for the first part of the session, then the bubble deflates and Technology leads a long bear market while defensive sectors (Utilities, Healthcare) hold up better. Teaches the danger of chasing hot sectors.'],
        ['Session length', 'Number of trading days to play: 30 (a month and a half), 60 (about a quarter), 120 (about six months) or 250 (about a year). Longer sessions give a fairer test of a strategy because luck averages out.'],
        ['Starting capital', '$10,000, $100,000 or $1,000,000. Larger accounts can diversify more finely; very large orders in small stocks start to move the price against you (market impact).'],
        ['Account: Cash', 'You can only buy with the cash you have. No borrowing and no short selling. The safest choice for beginners.'],
        ['Account: Margin', 'You can borrow up to 2x your equity and sell short. Magnifies gains and losses, charges interest on borrowed money, and can trigger forced liquidation (a margin call). See <b>Margin and shorting</b>.'],
        ['Trading costs: Retail broker', 'A realistic online broker: $0.005 per share commission ($1 minimum, never more than 1% of the trade), plus the bid/ask spread and market impact on every aggressive fill. The default and the one used in all graded modes.'],
        ['Trading costs: Zero-commission app', 'No commission, but the effective spread is 1.6x wider, because such apps are paid by routing your orders to market makers (payment for order flow). Often cheaper for small trades, more expensive for large or frequent ones.'],
        ['Trading costs: Frictionless (unrealistic)', 'No costs at all. Not realistic. Use it only to measure how much costs hurt you: play the same seed with and without costs and compare.'],

        if (held > 0 && tk.side === 'buy' && last < a.pos[s.sym].avg * 0.97) { flags.avgDown = true; add('warn', 'Averaging down: adding to a losing position.'); }
        if (held < 0 && tk.side === 'sell' && last > a.pos[s.sym].avg * 1.03) { flags.avgDown = true; add('warn', 'Adding to a losing short.'); }
        if (!s.isFund) {
          const ne = TM.nextEarnings(w, i, t);
          if (ne != null && ne - t <= 7) add('warn', `Earnings ${ne - t === 1 ? 'at tomorrow’s open' : 'in ' + (ne - t) + ' trading days'} (${F.sdate(ne)}). Implied move ±${F.pct(s.earnSd * 0.75)}.`);
        }
        if (tk.side === 'sell') {
          const xd = TM.nextExDiv(w, i, t);
          if (xd && xd.d - t <= 10) add('info', `Ex-dividend on ${F.sdate(xd.d)}: shorts pay the $${xd.amt.toFixed(2)} dividend.`);
          if (s.hardToBorrow) add('warn', `Hard to borrow: shorting costs ${F.pct(s.borrowFee)} a year.`);
        }
      }
      const adv = w.adv20[i][Math.min(t + 1, w.T - 1)];
      if (qty > adv * 0.05) add('warn', `Order is ${F.pct(qty / adv)} of average daily volume: expect heavy market impact.`);
      if (tk.type === 'limit' && lim > 0 && (tk.side === 'buy' ? lim >= last : lim <= last)) add('info', 'Limit is through the current price, so it will probably fill at the open like a market order.');
      if ((tk.type === 'stop' || tk.type === 'stoplimit') && stp > 0 && (tk.side === 'buy' ? stp <= last : stp >= last)) add('warn', 'Stop is already through the current price: it will trigger at the open.');
    }
    return { items, blocking: items.some((x) => x.lvl === 'block'), est, ref, qty, opening, flags, eq, risk, stop, target };
  }

  function onSessionEnd() {

    App.progress.history = App.progress.history.slice(0, 25);
    if (g.mode === 'level' && g.result.status === 'passed' && !g.unranked) App.progress.levels[g.level].passed = true;
    if (g.mode === 'daily' && !g.unranked && !App.progress.daily[g.daily]) App.progress.daily[g.daily] = { total: m.total, excess: m.excess, sharpe: m.sharpe, maxDD: m.maxDD };
    saveProgress();
    App.screen = 'end';
  }
  function nextDays(n) {
    const g = G(), w = W();
    if (!g || g.status !== 'active') return;
    const agg = { fills: [], alerts: [], rejects: [], marginCall: null, dayPnl: 0, divs: 0, interest: 0, borrow: 0, startT: g.t };
    for (let k = 0; k < n && g.status === 'active'; k++) {
      const s = TM.advanceDay(w, g);
      agg.fills = agg.fills.concat(s.fills);
      agg.alerts = agg.alerts.concat(s.alerts || []);
      agg.rejects = agg.rejects.concat(s.rejects);
      agg.dayPnl += s.dayPnl; agg.divs += s.divs; agg.interest += s.interest; agg.borrow += s.borrow;
      if (s.marginCall) agg.marginCall = s.marginCall;
    }
    agg.endT = g.t;
    App.ui.banner = agg;
    App.ui.hover = null;
    App.ui.editOrder = null;
    if (g.status !== 'active') onSessionEnd();
    saveGame();

  }
  function setBind(path, el) {

    if (numeric) val = val === '' ? null : Number(val);
    if (root === 'ticket') App.ui.ticket[key] = val;
    else if (root === 'edit') App.ui.edit[key] = val;
    else if (root === 'practice') App.ui.practice[key] = val;
    else if (root === 'ui') App.ui[key] = val;
    else if (root === 'botCfg' && G()) { G().botCfg[key] = Math.max(0, Number(val) || 0); saveGame(); }
    else if (root === 'rules' && G()) { G().player.rules[key] = el.type === 'checkbox' ? val : numeric ? (val == null ? 0 : val) : val; saveGame(); }
    else if (root === 'lesson' && G()) { const tr = G().player.trades.find((x) => x.id === Number(key)); if (tr) { tr.lesson = val; saveGame(); } }
    else if (root === 'name') { App.progress.name = String(val).slice(0, 24); saveProgress(); }

    suggestStop() {
      const w = W(), g = G(), i = idx(App.ui.sel), tk = App.ui.ticket, last = w.c[i][g.t];
      const a2 = atr(i, g.t, 14) * 2;

      if (tk.bracket) tk.sl = v; else tk.planStop = v;

    suggestTarget() {
      const pc = preTradeChecks(), tk = App.ui.ticket;
      if (!(pc.stop > 0)) { toast('Set the stop first; the target is placed at 2R.'); return; }
      tk.tp = TM.r2(pc.ref + (pc.ref - pc.stop) * 2).toFixed(2);
      render();
    },
    sizeIt() {
      const w = W(), g = G(), a = g.player, tk = App.ui.ticket, pc = preTradeChecks();
      if (!(pc.stop > 0) || pc.stop === pc.ref) { toast('Set a stop first (bracket stop or planned stop). Position size comes from the distance to the stop.'); return; }
      const riskPct = Math.max(0.05, Number(tk.riskPct) || 1) / 100;
      let q = Math.floor(pc.eq * riskPct / Math.abs(pc.ref - pc.stop));
      const maxPos = a.rules && a.rules.maxPosPct ? Math.floor(pc.eq * a.rules.maxPosPct / 100 / pc.ref) : Infinity;
      const bp = Math.floor(TM.buyingPower(w, a, g.t) * 0.98 / pc.ref);
      const capped = Math.min(q, maxPos, bp);
      tk.qty = String(Math.max(0, capped));
      if (capped < q) toast(`Sized down from ${q} to ${capped} shares by your position limit or buying power.`);
      render();
    },

      const spec = {

  function tabLearn() {

      ['How orders execute here', `<p>Each day you act after the close. Market orders fill at the next <b>open</b>, so overnight gaps from earnings, news and macro data move your fill away from today's close. Limits and stops are checked along the day's path: open, then high and low in a realistic order, then close.</p>`],

      ['Trading costs', `<p>You pay commission, half the <b>bid/ask spread</b> on each aggressive fill, and <b>market impact</b> of about <code>0.7 × daily volatility × √(shares ÷ average daily volume)</code>. Small, illiquid and volatile stocks cost more. Spreads widen when volatility rises. Passive limit fills avoid the spread.</p>`],
      ['Position sizing: the 1% rule', `<p>Size trades from the stop, not from conviction. With $100,000, risking 1% means $1,000 per trade. Entry $50 and stop $47 is $3 of risk per share, so the position is 1,000 ÷ 3 = <b>333 shares</b>. Use <b>Size from stop</b> in the ticket.</p>`],
      ['Stops and gaps', `<p>A stop at $95 on a stock that opens at $88 after bad earnings fills near $88, not $95. That is why losses can exceed 1R and why position size matters more than the stop level. Earnings dates and implied moves are on the calendar in advance.</p>`],
      ['Dividends and shorting', `<p>On the <b>ex-dividend</b> date the price drops by about the dividend. Holders receive the cash and short sellers pay it. Shorting also costs a <b>borrow fee</b>, which is much higher for hard-to-borrow stocks. A short's loss is unlimited, because a price can keep rising.</p>`],
      ['Margin', `<p>A margin account lets you borrow up to 2x your equity (50% initial margin) and sell short. If equity falls below maintenance (25% of longs, 30% of shorts), the broker <b>liquidates your largest positions at the close</b> without asking. Margin loans cost the policy rate plus 2.5%.</p>`],
      ['Diversification and beta', `<p>Most stocks move with the market (correlation here is about 0.5). <b>Beta</b> measures that sensitivity. Diversifying removes stock-specific risk but not market risk, and correlations jump in crashes, just when you need diversification most.</p>`],
      ['Drawdown arithmetic', `<p>Losses compound against you: −10% needs +11% to recover, −20% needs +25%, −33% needs +50% and −50% needs +100%. That is why professional mandates have hard drawdown limits, like the Level 2 evaluation.</p>`],
      ['Reading your performance', `<ul><li><b>Sharpe</b>: excess return per unit of volatility. Above 1 is good.</li><li><b>Sortino</b>: the same, counting only downside volatility.</li><li><b>Alpha</b>: return not explained by your beta to the index.</li><li><b>Profit factor</b>: gross wins ÷ gross losses.</li><li><b>Expectancy</b>: average net P&amp;L per trade.</li><li><b>R-multiple</b>: P&amp;L ÷ the risk you planned. +2R means you made twice what you risked.</li></ul>`],

    <div class="row"><h2 class="grow">${esc(sec.title)}</h2>${opts && opts.open ? `<button class="btn sm noprint" data-act="helpGo" data-arg="${sec.id}">Open section</button>` : ''}</div>

  function viewHelpBody() {

    }

    const prev = TM.HELP[k - 1], next = TM.HELP[k + 1];
    return helpSection(TM.HELP[k]) + `<div class="help-pager noprint">

      ${next ? `<button class="btn" data-act="helpGo" data-arg="${next.id}">${esc(next.title)} →</button>` : '<span></span>'}</div>`;

  // ---------- charts ----------
  function prep(cv) {
    const dpr = window.devicePixelRatio || 1;
    const r = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, W: r.width, H: r.height };
  }
  function niceStep(raw) {
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / p;
    return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
  }
  function alpha(hex, a) {
    if (hex.startsWith('#') && hex.length === 7) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
    return hex;
  }
  function drawPrice() {
    const cv = document.getElementById('priceChart');
    if (!cv) return;
    const { ctx, W: Wd, H } = prep(cv);
    const w = W(), g = G(), sym = App.ui.sel, i = idx(sym), t = g.t;
    const n = Math.min(App.ui.range, t + 1), a0 = t - n + 1;
    const padL = 4, padR = 58, top = 22, bottom = 18;
    const volH = App.ui.showVol ? Math.round((H - top - bottom) * 0.17) : 0;
    const ph = H - top - bottom - volH - (volH ? 6 : 0);
    let lo = Infinity, hi = -Infinity;
    for (let d = a0; d <= t; d++) { lo = Math.min(lo, w.l[i][d]); hi = Math.max(hi, w.h[i][d]); }
    const accent = cssVar('--accent'), up = cssVar('--up'), dn = cssVar('--down'), info = cssVar('--info'), grid = cssVar('--grid'), faint = cssVar('--faint'), text = cssVar('--text'), panel = cssVar('--panel');
    const lines = [];
    const p = g.player.pos[sym];
    if (p) lines.push({ y: p.avg, label: 'avg', color: accent });
    for (const o of g.player.orders) {
      if (o.sym !== sym || (o.status !== 'open' && o.status !== 'pending')) continue;
      if (o.limit != null) lines.push({ y: o.limit, label: o.role === 'target' ? 'tgt' : 'lmt', color: info });
      if (o.stop != null) lines.push({ y: o.stop, label: 'stp', color: dn });
    }
    for (const L of lines) if (L.y > lo * 0.75 && L.y < hi * 1.3) { lo = Math.min(lo, L.y); hi = Math.max(hi, L.y); }
    const pad = (hi - lo) * 0.06 || 1;
    lo -= pad; hi += pad;
    const Y = (v) => top + (hi - v) / (hi - lo) * ph;
    const cw = (Wd - padL - padR) / n;
    const X = (d) => padL + (d - a0 + 0.5) * cw;
    App.geom = { a0, n, cw, padL, t };
    ctx.font = '11px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.textBaseline = 'middle';
    const step = niceStep((hi - lo) / 5);
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
      const y = Math.round(Y(v)) + 0.5;
      ctx.strokeStyle = grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(Wd - padR, y); ctx.stroke();
      ctx.fillStyle = faint; ctx.fillText(v.toFixed(step < 1 ? 2 : 0), Wd - padR + 6, y);
    }
    let lastM = -1;
    ctx.textBaseline = 'alphabetic';
    for (let d = a0; d <= t; d++) {
      const m = new Date(w.dates[d]).getUTCMonth();
      if (m !== lastM) {
        if (d > a0 + 2) { ctx.fillStyle = faint; ctx.fillText(TM.fmtDate(w.dates[d], 'month'), X(d) - 8, H - 4); ctx.strokeStyle = grid; ctx.beginPath(); ctx.moveTo(Math.round(X(d)) + 0.5, top); ctx.lineTo(Math.round(X(d)) + 0.5, H - bottom); ctx.stroke(); }
        lastM = m;
      }
    }
    if (volH) {
      let vmax = 0;
      for (let d = a0; d <= t; d++) vmax = Math.max(vmax, w.v[i][d]);
      const vb = top + ph + 6 + volH;
      for (let d = a0; d <= t; d++) {
        const hgt = w.v[i][d] / vmax * volH;
        ctx.fillStyle = alpha(w.c[i][d] >= w.o[i][d] ? up : dn, 0.35);
        ctx.fillRect(X(d) - Math.max(0.5, cw * 0.35), vb - hgt, Math.max(1, cw * 0.7), hgt);
      }
    }
    const bw = Math.max(1, Math.min(9, cw * 0.66));
    for (let d = a0; d <= t; d++) {
      const o = w.o[i][d], h = w.h[i][d], l = w.l[i][d], c = w.c[i][d];
      const col = c >= o ? up : dn, x = Math.round(X(d)) + 0.5;
      ctx.strokeStyle = col; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, Y(h)); ctx.lineTo(x, Y(l)); ctx.stroke();
      const y1 = Y(Math.max(o, c)), y2 = Y(Math.min(o, c));
      ctx.fillStyle = col;
      ctx.fillRect(x - bw / 2, y1, bw, Math.max(1, y2 - y1));
    }
    const drawSma = (len, color) => {
      ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath();
      let started = false;
      for (let d = a0; d <= t; d++) {
        const v = TM.sma(w.c[i], d, len);
        if (v == null) continue;
        if (!started) { ctx.moveTo(X(d), Y(v)); started = true; } else ctx.lineTo(X(d), Y(v));
      }
      ctx.stroke();
    };
    if (App.ui.sma50) drawSma(50, cssVar('--sma50'));
    if (App.ui.sma20) drawSma(20, cssVar('--sma20'));
    ctx.font = '600 10px ui-monospace, SFMono-Regular, Menlo, monospace';
    const earn = new Set(w.earnDays[i]);
    const divs = new Set(w.divDays[i].filter((x) => x.decl <= t).map((x) => x.d));
    for (let d = a0; d <= t; d++) {
      if (earn.has(d)) { ctx.fillStyle = cssVar('--warn'); ctx.fillText('E', X(d) - 3, top + ph - 2); }
      if (divs.has(d)) { ctx.fillStyle = info; ctx.fillText('D', X(d) - 3, top + ph - 12); }
      const ev = w.events[d].find((e) => e.sym === sym && e.type === 'news');
      if (ev) { ctx.fillStyle = ev.tone > 0 ? up : ev.tone < 0 ? dn : faint; ctx.beginPath(); ctx.arc(X(d), Y(w.h[i][d]) - 6, 2.5, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.font = '10px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.textBaseline = 'middle';
    const tag = (v, label, color, solid) => {
      if (v < lo || v > hi) return;
      const y = Y(v);
      ctx.strokeStyle = color; ctx.setLineDash(solid ? [] : [4, 3]); ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(Wd - padR, y); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = color; ctx.fillRect(Wd - padR + 1, y - 8, padR - 2, 16);
      ctx.fillStyle = panel; ctx.fillText(label, Wd - padR + 4, y);
    };
    for (const L of lines) tag(L.y, `${L.label} ${L.y.toFixed(2)}`, L.color, false);
    tag(w.c[i][t], w.c[i][t].toFixed(2), w.c[i][t] >= w.c[i][t - 1] ? up : dn, true);
    const hd = App.ui.hover != null && App.ui.hover >= a0 && App.ui.hover <= t ? App.ui.hover : t;
    if (App.ui.hover != null) {
      ctx.strokeStyle = faint; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(Math.round(X(hd)) + 0.5, top); ctx.lineTo(Math.round(X(hd)) + 0.5, H - bottom); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.font = '11px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillStyle = text;
    ctx.textBaseline = 'top';
    const chd = hd > 0 ? w.c[i][hd] / w.c[i][hd - 1] - 1 : 0;
    const ohlc = `O ${w.o[i][hd].toFixed(2)}  H ${w.h[i][hd].toFixed(2)}  L ${w.l[i][hd].toFixed(2)}  C ${w.c[i][hd].toFixed(2)}`;
    let readout = `${TM.fmtDate(w.dates[hd])}  ${ohlc}  ${(chd * 100).toFixed(2)}%  Vol ${F.big(w.v[i][hd])}`;
    if (ctx.measureText(readout).width > Wd - padR) readout = `${TM.fmtDate(w.dates[hd], 'short')}  ${ohlc}  ${(chd * 100).toFixed(1)}%`;
    if (ctx.measureText(readout).width > Wd - padR) readout = `${TM.fmtDate(w.dates[hd], 'short')}  C ${w.c[i][hd].toFixed(2)}  ${(chd * 100).toFixed(1)}%  H ${w.h[i][hd].toFixed(2)}  L ${w.l[i][hd].toFixed(2)}`;
    ctx.fillText(readout, padL + 2, 4);
  }
  function drawLines(id, sel, opts) {
    const cv = document.getElementById(id);
    if (!cv) return;
    const { ctx, W: Wd, H } = prep(cv);
    const w = W(), g = G(), start = w.start, t = g.t;
    const accts = { you: g.player };
    for (const b of TM.BOT_DEFS) accts[b.id] = g.bots[b.id];
    const series = SERIES.filter((s) => sel[s.id]).map((s) => ({ color: cssVar(s.v), you: s.id === 'you', vals: (opts && opts.dd ? TM.drawdown(accts[s.id].equity.map((e) => e.eq)).series : accts[s.id].equity.map((e) => e.eq / accts[s.id].startCash - 1)) }));
    const padL = 6, padR = 52, top = 8, bottom = 18;
    let lo = 0, hi = 0;
    for (const s of series) for (const v of s.vals) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
    if (hi - lo < 0.02) { hi += 0.01; lo -= 0.01; }
    const span = Math.max(1, t - start);
    const X = (k) => padL + k / span * (Wd - padL - padR);
    const Y = (v) => top + (hi - v) / (hi - lo) * (H - top - bottom);
    const grid = cssVar('--grid'), faint = cssVar('--faint');
    ctx.font = '11px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.textBaseline = 'middle';
    const step = niceStep((hi - lo) / 4);
    for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) {
      const y = Math.round(Y(v)) + 0.5;
      ctx.strokeStyle = Math.abs(v) < 1e-9 ? faint : grid; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(Wd - padR, y); ctx.stroke();
      ctx.fillStyle = faint; ctx.fillText((v * 100).toFixed(step < 0.01 ? 1 : 0) + '%', Wd - padR + 6, y);
    }
    ctx.textBaseline = 'alphabetic';
    let lastM = -1;
    for (let d = start; d <= t; d++) {
      const m = new Date(w.dates[d]).getUTCMonth();
      if (m !== lastM) { if (d > start + 2) { ctx.fillStyle = faint; ctx.fillText(TM.fmtDate(w.dates[d], 'month'), X(d - start) - 8, H - 4); } lastM = m; }
    }
    for (const s of series.sort((x, y) => x.you - y.you)) {
      ctx.strokeStyle = s.color; ctx.lineWidth = s.you ? 2.5 : 1.5;
      ctx.beginPath();
      s.vals.forEach((v, k) => { if (k) ctx.lineTo(X(k), Y(v)); else ctx.moveTo(X(k), Y(v)); });
      ctx.stroke();
    }
  }
  function drawRegime(id) {
    const cv = document.getElementById(id);
    if (!cv) return;
    const { ctx, W: Wd, H } = prep(cv);
    const w = W(), g = G(), start = w.start, t = g.t, padL = 6, padR = 52;
    const span = Math.max(1, t - start), bw = (Wd - padL - padR) / span;
    for (let d = start + 1; d <= t; d++) { ctx.fillStyle = cssVar('--reg-' + w.regime[d]); ctx.fillRect(padL + (d - start - 1) * bw, 0, bw + 0.5, H); }
    let lo = Infinity, hi = -Infinity;
    for (let d = start; d <= t; d++) { lo = Math.min(lo, w.tmx[d]); hi = Math.max(hi, w.tmx[d]); }
    ctx.strokeStyle = cssVar('--text'); ctx.lineWidth = 1.5; ctx.beginPath();
    for (let d = start; d <= t; d++) { const x = padL + (d - start) * bw, y = 6 + (hi - w.tmx[d]) / (hi - lo || 1) * (H - 12); if (d === start) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
    ctx.stroke();
    ctx.fillStyle = cssVar('--faint'); ctx.font = '11px ui-monospace, SFMono-Regular, Menlo, monospace'; ctx.textBaseline = 'middle';
    ctx.fillText('TMX', Wd - padR + 6, H / 2);
  }
  function drawCharts() {
    if (App.screen === 'game') {
      drawPrice();
      if (App.ui.tab === 'performance') { drawLines('perfChart', App.ui.perf); drawLines('ddChart', { you: true, index: true }, { dd: true }); }
    } else if (App.screen === 'end') {
      const all = {}; SERIES.forEach((s) => { all[s.id] = true; });
      drawLines('endChart', all); drawRegime('regimeChart');
    }
  }

  // ---------- render & events ----------
  function render() {
    const root = document.getElementById('app');
    const keep = {};
    root.querySelectorAll('[data-keep]').forEach((el) => { keep[el.dataset.keep] = el.scrollTop; });
    const ae = document.activeElement;
    const focusBind = ae && ae.dataset ? ae.dataset.bind : null;
    if (App.screen === 'game' && App.game) root.innerHTML = viewGame();
    else if (App.screen === 'end' && App.game) root.innerHTML = viewEnd();
    else if (App.screen === 'help') root.innerHTML = viewHelp();
    else { App.screen = 'home'; root.innerHTML = viewHome(); }
    root.querySelectorAll('[data-keep]').forEach((el) => { if (keep[el.dataset.keep] != null) el.scrollTop = keep[el.dataset.keep]; });
    if (focusBind) { const el = root.querySelector(`[data-bind="${focusBind}"]`); if (el && el.type !== 'checkbox' && el.tagName !== 'SELECT') el.focus(); }
    drawCharts();
    watchCanvases();
    setTopbarHeight();
    if (App.screen === 'game') updatePreview();
  }
  // Sticky elements sit just under the top bar, whose height changes with screen width.
  function setTopbarHeight() {
    const tb = document.querySelector('.topbar');
    document.documentElement.style.setProperty('--tb', (tb ? tb.offsetHeight : 0) + 'px');
  }
  // Redraw charts whenever their size changes: folding/unfolding a phone, rotating, or resizing a window.
  let ro = null;
  function watchCanvases() {
    if (!window.ResizeObserver) return;
    if (ro) ro.disconnect();
    let pending = false;
    const sizes = new WeakMap();
    ro = new ResizeObserver((entries) => {
      const changed = entries.some((en) => { const k = Math.round(en.contentRect.width) + 'x' + Math.round(en.contentRect.height); const prev = sizes.get(en.target); sizes.set(en.target, k); return prev !== undefined && prev !== k; });
      if (!changed || pending) return;
      pending = true;
      requestAnimationFrame(() => { pending = false; drawCharts(); });
    });
    document.querySelectorAll('#app canvas').forEach((c) => ro.observe(c));
  }

  function init() {
    applyTheme();
    loadSaved();
    if (App.screen !== 'home' && App.game && App.game.status === 'active') App.ui.banner = null;
    render();
    document.addEventListener('click', (ev) => {
      const el = ev.target.closest('[data-act]');
      if (!el || el.disabled) return;
      const fn = ACTIONS[el.dataset.act];
      if (fn) { if (el.tagName !== 'INPUT') ev.preventDefault(); fn(el.dataset.arg, el, ev); }
    });
    document.addEventListener('keydown', (ev) => {
      const tag = ev.target.tagName;
      if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('wrow')) { ACTIONS.sel(ev.target.dataset.arg); return; }
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || ev.metaKey || ev.ctrlKey || ev.altKey) return;
      if ((ev.key === 'n' || ev.key === 'N') && App.screen === 'game') { ev.preventDefault(); nextDays(1); }
    });
    document.addEventListener('input', (ev) => {
      const el = ev.target;
      if (el.id === 'helpQ') { App.ui.helpQ = el.value; refreshHelp(); window.scrollTo(0, 0); return; }
      if (!el.dataset || !el.dataset.bind) return;
      setBind(el.dataset.bind, el);
      if (el.dataset.live) updatePreview();
    });
    document.addEventListener('change', (ev) => {
      const el = ev.target;
      if (el.id === 'importFile' && el.files && el.files[0]) { importFile(el.files[0]); el.value = ''; return; }
      if (!el.dataset || !el.dataset.bind) return;
      setBind(el.dataset.bind, el);
      if (el.dataset.rerender || el.dataset.bind.startsWith('rules.') || el.dataset.bind.startsWith('botCfg.')) render();
      else if (el.dataset.live) updatePreview();
    });
    const scrub = (ev) => {
      if (ev.target.id !== 'priceChart' || !App.geom) return;
      const r = ev.target.getBoundingClientRect();
      const d = Math.max(App.geom.a0, Math.min(App.geom.t, App.geom.a0 + Math.floor((ev.clientX - r.left - App.geom.padL) / App.geom.cw)));
      if (d !== App.ui.hover) { App.ui.hover = d; drawPrice(); }
    };
    document.addEventListener('pointermove', scrub);
    document.addEventListener('pointerdown', scrub);
    document.addEventListener('pointerout', (ev) => { if (ev.target.id === 'priceChart' && ev.pointerType === 'mouse' && App.ui.hover != null) { App.ui.hover = null; drawPrice(); } });
    let rt = null;
    window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { drawCharts(); setTopbarHeight(); }, 120); });
    window.addEventListener('scroll', () => { const b = document.getElementById('toTop'); if (b) b.classList.toggle('show', window.scrollY > 500); }, { passive: true });
    if (window.matchMedia) matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (!App.progress.theme) render(); });
  }
  ACTIONS.noop = () => {};
  ACTIONS.help = (arg) => {
    if (App.screen !== 'help') App.ui.helpFrom = App.screen;
    App.ui.helpSec = arg || 'start';
    App.ui.helpQ = '';
    App.screen = 'help';
    render();
    window.scrollTo(0, 0);
    centreActiveChip();
  };
  ACTIONS.helpGo = (arg) => {
    App.ui.helpSec = arg;
    App.ui.helpQ = '';
    const qi = document.getElementById('helpQ');
    if (qi) qi.value = '';
    refreshHelp();
    window.scrollTo(0, 0);
    centreActiveChip();
  };
  ACTIONS.toTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });
  ACTIONS.helpBack = () => { App.screen = App.ui.helpFrom === 'help' || !App.game && App.ui.helpFrom !== 'home' ? 'home' : App.ui.helpFrom; render(); window.scrollTo(0, 0); };
  ACTIONS.print = () => {
    App.ui.helpPrintAll = true;
    refreshHelp();
    const done = () => { App.ui.helpPrintAll = false; refreshHelp(); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => window.print(), 50);
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})(TM);

</script>
</body>
